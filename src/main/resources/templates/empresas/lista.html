<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Empresas</title>
</head>
<body>
<header th:replace="~{fragmentos/navegacion :: navegacion}"></header>
<main>
    <h2>Listado de empresas</h2>
    <p th:if="${#lists.isEmpty(empresas)}">No hay empresas registradas.</p>
    <table th:unless="${#lists.isEmpty(empresas)}">
        <caption>Empresas registradas</caption>
        <thead>
        <tr><th scope="col">ID</th><th scope="col">Nombre</th><th scope="col">NIT</th><th scope="col">Correo</th><th scope="col">Acciones</th></tr>
        </thead>
        <tbody>
        <tr th:each="empresa : ${empresas}">
            <td th:text="${empresa.id}"></td>
            <td th:text="${empresa.nombre}"></td>
            <td th:text="${empresa.nit}"></td>
            <td th:text="${empresa.correoContacto}"></td>
            <td>
                <a th:href="@{/vista/empresas/{id}(id=${empresa.id})}">Ver detalle</a>
                | <a th:href="@{/vista/empresas/{id}/editar(id=${empresa.id})}">Editar</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
