
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onomatopeya-frontend
  namespace: onomatopeya
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onomatopeya-frontend
  template:
    metadata:
      labels:
        app: onomatopeya-frontend
    spec:
      containers:
        - name: frontend
          image: principal-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: onomatopeya
spec:
  type: NodePort
  selector:
    app: onomatopeya-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080

