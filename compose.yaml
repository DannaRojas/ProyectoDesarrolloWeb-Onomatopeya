services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: gestion_procesos
      POSTGRES_USER: gestor_procesos
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en un archivo .env local}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestor_procesos -d gestion_procesos"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/gestion_procesos
      DB_USERNAME: gestor_procesos
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en un archivo .env local}
      SERVER_ADDRESS: 0.0.0.0
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos_postgres:
